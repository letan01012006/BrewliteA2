name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Generate/type-check only; CI unit tests do not connect to PostgreSQL.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/brewlite_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        if: matrix.app == 'api'
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Deployment safety tests
        if: matrix.app == 'web'
        run: node --test ../../tests/deployment/*.test.mjs
      - name: Build
        run: npm run build

  e2e:
    # Không nằm trong danh sách check bắt buộc của branch protection (chỉ CI (api) và CI (web)).
    # Chạy integration test của API trên PostgreSQL thật và kịch bản trình duyệt menu -> xác nhận đơn.
    name: E2E (api + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://brewlite:brewlite@127.0.0.1:5432/brewlite?schema=public
      TEST_DATABASE_URL: postgresql://brewlite:brewlite@127.0.0.1:5432/brewlite_test?schema=public
      PORT: '4000'
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      OTP_HASH_SECRET: ci-only-otp-secret-at-least-32-characters-long
      AUTH_OTP_DEMO: 'true'
      SMS_PROVIDER: local
      PAYMENT_MOCK_ENABLED: 'true'
      LOYALTY_WELCOME_POINTS: '50000'
      BACKEND_API_URL: http://127.0.0.1:4000/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Create test database
        run: PGPASSWORD=brewlite psql -h 127.0.0.1 -U brewlite -d brewlite -c 'CREATE DATABASE brewlite_test'
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Generate Prisma Client, migrate and seed
        working-directory: apps/api
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy
          npm run prisma:seed
      - name: API integration tests
        working-directory: apps/api
        run: npm run test:e2e
      - name: Build and start API
        working-directory: apps/api
        run: |
          npm run build
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/api/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Install, build and start web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          nohup npm start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npm test
