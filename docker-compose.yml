name: brewlite-a2

x-api-common: &api-common
  image: brewlite-a2-api:local
  build:
    context: ./apps/api
  env_file:
    - ./apps/api/.env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
    PORT: "4000"
  init: true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api-init:
    <<: *api-common
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run prisma:seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(async r => { if (!r.ok || (await r.json()).db !== 'up') process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    image: brewlite-a2-web:local
    build:
      context: ./apps/web
      args:
        BACKEND_API_URL: http://api:4000/api
    environment:
      BACKEND_API_URL: http://api:4000/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  pgdata:
    name: brewlite-a2_pgdata
